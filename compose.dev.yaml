services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_DB: ${ARTICLE_DB_NAME:-article_agent}
      POSTGRES_USER: ${ARTICLE_DB_USER:-article_agent}
      POSTGRES_PASSWORD: ${ARTICLE_DB_PASSWORD:-article_agent}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${ARTICLE_DB_PORT:-55433}:5432"
    volumes:
      - article_agent_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Development compatibility target only. Production must use a separately
  # selected and maintained S3-compatible service.
  object_store:
    profiles: ["object-store"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ARTICLE_AGENT_OBJECT_STORE_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${ARTICLE_AGENT_OBJECT_STORE_SECRET_KEY:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${ARTICLE_OBJECT_STORE_API_PORT:-59000}:9000"
      - "127.0.0.1:${ARTICLE_OBJECT_STORE_CONSOLE_PORT:-59001}:9001"
    volumes:
      - article_agent_object_store_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  article_agent_pgvector_data:
  article_agent_object_store_data:
