extends: config.yaml

paths:
  topic_library: /app/workspace/topic-library
  knowledge_base: /app/workspace/knowledge
  output_root: /app/workspace/projects
  data_file: /app/workspace/data/tasks.json

prompts:
  humanize: /app/workspace/humanize.txt

llm:
  reasoning_effort: xhigh

features:
  knowledge_agent_enabled: false
  workflow_assistant_enabled: true
  workflow_assistant_attachments_enabled: true
  workflow_assistant_project_changes_enabled: true
  workflow_assistant_gap_fill_enabled: true
