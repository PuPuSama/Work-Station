name: article-agent-wordpress-sandbox

x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?Run provision.py first}
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', '${WP_URL:?Set the HTTPS test site URL}');
    define('WP_SITEURL', '${WP_URL}');
    define('WP_ENVIRONMENT_TYPE', 'staging');
    define('DISALLOW_FILE_EDIT', true);
    define('FORCE_SSL_ADMIN', true);

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=30"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?Run provision.py first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  wordpress:
    # WordPress 7.1 tested on 2026-09-09
    image: wordpress@sha256:5a93c470ae8220fddf71f6ebe3bc94e615ddc2ae4d9810f795b830fb11c41a17
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-environment
    ports:
      - "127.0.0.1:18088:80"
    volumes:
      - files:/var/www/html
      - ./article-agent-meta.php:/var/www/html/wp-content/mu-plugins/article-agent-meta.php:ro
      - ./apache-auth.conf:/etc/apache2/conf-enabled/zz-article-agent-auth.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-login.php >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  wpcli:
    image: wordpress@sha256:2b5e9d4d3e51909dca1aaa4732e9f5e5bf0377c2114dbd8ff39f060bff202586
    profiles: ["tools"]
    user: "33:33"
    mem_limit: 256m
    environment: *wp-environment
    volumes:
      - files:/var/www/html
      - ./article-agent-meta.php:/var/www/html/wp-content/mu-plugins/article-agent-meta.php:ro
      - ./bootstrap.php:/opt/bootstrap.php:ro
    entrypoint: ["wp"]

volumes:
  database:
  files:
