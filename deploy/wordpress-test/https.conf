# IP clients omit DNS SNI. Named sites retain their own SNI certificates.
server {
    listen 443 ssl default_server;
    server_name 43.154.92.36;
    ssl_certificate /etc/letsencrypt-article-agent-wp/live/43.154.92.36/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-article-agent-wp/live/43.154.92.36/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($host != "43.154.92.36") { return 444; }
    location = /xmlrpc.php { return 403; }
    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
