paths:
  topic_library: "workspace/topic-library"
  knowledge_base: "../Knowledge"
  output_root: "workspace/projects"

article:
  language: "English"
  title_candidates: 10
  default_word_count: 1200
  ai_pass_threshold: 30

prompts:
  humanize: "backend/prompts/humanize_ci.txt"

docx_format:
  font: "Times New Roman"
  styles:
    title_1:
      size_pt: 22
    title_2:
      size_pt: 18
    title_3:
      size_pt: 13.5
    body:
      size_pt: 12

llm:
  provider: "responses"
  base_url: "https://api.openai.com/v1"
  model: "gpt-5.6-sol"
  reasoning_effort: "medium"
  available_models:
    - "gpt-5.6-sol"
    - "gpt-5.6-terra"
    - "gpt-5.6-luna"
  available_reasoning_efforts:
    - "low"
    - "medium"
    - "high"
    - "xhigh"

features:
  knowledge_agent_enabled: false
  workflow_assistant_enabled: false
  workflow_assistant_attachments_enabled: false
  workflow_assistant_project_changes_enabled: false
  workflow_assistant_gap_fill_enabled: false

workflow_assistant:
  max_concurrency: 5
  soft_budget_warning_tokens: 24000

server_jobs:
  global_concurrency: 8
  project_concurrency: 5
