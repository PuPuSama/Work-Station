paths:
  topic_library: "D:\\article\\话题库"
  knowledge_base: "D:\\article\\Knowledge"
  output_root: "D:\\article"
  data_file: "D:\\article\\article-agent\\data\\tasks.json"

article:
  language: "English"
  title_candidates: 10
  default_word_count: 1200
  ai_pass_threshold: 30

prompts:
  humanize: "D:\\article\\降ai提示词-未测试效果版.txt"

docx_format:
  font: "Times New Roman"
  styles:
    title_1:
      size_pt: 22
    title_2:
      size_pt: 18
    title_3:
      size_pt: 13.5
    body:
      size_pt: 12

llm:
  provider: "responses"
  base_url: "https://api.openai.com/v1"
  model: "gpt-5.6-sol"

features:
  knowledge_agent_enabled: false
