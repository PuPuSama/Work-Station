name: Test and deploy production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_DB: article_agent
          POSTGRES_USER: article_agent
          POSTGRES_PASSWORD: article_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U article_agent -d article_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTICLE_AGENT_CONFIG: config.ci.yaml
      ARTICLE_AGENT_DATABASE_URL: postgresql+psycopg://article_agent:article_agent@127.0.0.1:5432/article_agent
      LLM_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Upgrade knowledge database
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy /home/ubuntu/Work-Station
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: 43.154.92.36
      DEPLOY_USER: ubuntu
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "DEPLOY_SSH_PRIVATE_KEY is missing" >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is missing" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/article_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/article_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact pushed commit
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/article_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA'" < deploy/deploy-production.sh
