services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: article-backend
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2560m
    cpus: 2.0
    pids_limit: 256
    env_file:
      - ${ARTICLE_ENV_FILE:-.env}
    environment:
      ARTICLE_AGENT_ROOT: /app
      ARTICLE_AGENT_CONFIG: /app/config.docker.yaml
    volumes:
      - ${ARTICLE_WORKSPACE_PATH:-./workspace}:/app/workspace
    networks:
      - article-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: article-frontend
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    env_file:
      - ${ARTICLE_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3012:3000"
    networks:
      - article-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  article-network:
    driver: bridge
