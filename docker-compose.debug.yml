name: article-agent-local-debug

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_USER: article_debug
      POSTGRES_PASSWORD: article_debug_local
      POSTGRES_DB: article_agent_debug
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - debug-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U article_debug -d article_agent_debug"]
      interval: 2s
      timeout: 3s
      retries: 30
  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: article_debug
      MINIO_ROOT_PASSWORD: article_debug_local
    ports:
      - "127.0.0.1:59018:9000"
    volumes:
      - debug-objects:/data

volumes:
  debug-postgres:
  debug-objects:
