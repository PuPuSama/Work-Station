name: article-agent-wordpress-test

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_local_only
      MARIADB_ROOT_PASSWORD: root_local_only
    volumes:
      - wordpress-test-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_local_only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - wordpress-test-files:/var/www/html
      - ./wordpress-test/theme:/var/www/html/wp-content/themes/article-agent-template:ro
      - ./wordpress-test/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress-test/apache-auth.conf:/etc/apache2/conf-enabled/zz-article-agent-auth.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-json/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_local_only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-test-files:/var/www/html
      - ./wordpress-test/theme:/var/www/html/wp-content/themes/article-agent-template:ro
      - ./wordpress-test/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./outputs/wordpress-test:/var/www/html/wp-content/uploads/article-agent-test
    entrypoint: ["wp"]

volumes:
  wordpress-test-db:
  wordpress-test-files:
